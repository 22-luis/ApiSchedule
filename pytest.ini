[tool:pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: marks tests as authentication tests
    users: marks tests as user management tests
    teams: marks tests as team management tests
    tasks: marks tests as task management tests
    programming: marks tests as programming management tests
    orders: marks tests as order management tests
    utils: marks tests as utility tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
